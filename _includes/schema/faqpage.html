{% if page.faqs %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
{%- for faq in page.faqs %}
    {
      "@type": "Question",
      "name": {{ faq.q | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ faq.a | jsonify }}
      }
    }{%- unless forloop.last %},{% endunless %}
{%- endfor %}
  ]
}
</script>
{% endif %}
